[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ig-publish"
version = "0.1.0"
description = "Publish Instagram Stories and Reels through the official Graph API: resumable uploads, strict order, no double posts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DEEGITECH" }]
keywords = ["instagram", "graph-api", "reels", "stories", "publishing", "scheduler", "ffmpeg", "social-media"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Multimedia :: Video :: Conversion",
    "Typing :: Typed",
]
# None on Python 3.11+ (tomllib is built in); Python 3.10 needs tomli to read a TOML configuration.
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jsonschema>=4.18",
    "ruff==0.16.10",  # pinned so a new release cannot break CI on an unrelated day; Dependabot bumps it
]

[project.scripts]
ig-publish = "ig_publish.cli:main"

[project.urls]
Homepage = "https://github.com/deegitech/ig-publish"
Documentation = "https://github.com/deegitech/ig-publish#readme"
Issues = "https://github.com/deegitech/ig-publish/issues"
Changelog = "https://github.com/deegitech/ig-publish/blob/main/CHANGELOG.md"
Security = "https://github.com/deegitech/ig-publish/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["src/ig_publish"]

[tool.hatch.build.targets.sdist]
include = [
    "src/ig_publish",
    "tests",
    "docs",
    "examples",
    "docker",
    "README.md",
    "README.tr.md",
    "CHANGELOG.md",
    "LICENSE",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "SIM105",  # contextlib.suppress is not always clearer
    "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.isort]
known-first-party = ["ig_publish"]
section-order = ["future", "standard-library", "third-party", "test-helpers", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
# tests/helpers.py puts src/ on sys.path, so it is imported before ig_publish
"test-helpers" = ["helpers", "mock_graph"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# The code is not run through a formatter (see CONTRIBUTING.md); `ruff check` is the gate.
