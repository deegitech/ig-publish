name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install the package with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples
      - name: Test (offline, against a local mock of the Graph API)
        run: python -m pytest -v -p no:cacheprovider

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The gitleaks binary is used directly (pinned version, pinned SHA-256); gitleaks-action needs a licence key
      # for organisation repositories. Update both values together.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"  # linux_x64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$asset" "${base}/${asset}"
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" gitleaks
      - name: Scan the git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .
      - name: Scan the working tree
        run: |
          "$RUNNER_TEMP/gitleaks" dir --redact --verbose --exit-code 1 .

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -f docker/Dockerfile -t ig-publish:ci .
      - name: Smoke test (non-root, read-only root filesystem)
        run: |
          test "$(docker run --rm --entrypoint id ig-publish:ci -u)" = 10001
          test "$(docker inspect --format '{{json .Config.Cmd}}' ig-publish:ci)" = '["schedule","dry"]'
          docker run --rm --read-only --tmpfs /tmp ig-publish:ci --version
          docker run --rm --read-only --tmpfs /tmp ig-publish:ci init /tmp/project
          docker run --rm --entrypoint ffprobe ig-publish:ci -version | head -n 1
