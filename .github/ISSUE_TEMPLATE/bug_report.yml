name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! **Do not paste access tokens, account, page or media IDs, private captions or file
        paths.** Replace them with placeholders (for example `17841401234567890`, `example.brand`).
        Security problems: please use [private reporting](https://github.com/deegitech/ig-publish/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `ig-publish --version`, plus your Python version and OS.
      placeholder: ig-publish 0.1.0, Python 3.12, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command you ran, a minimal (redacted) config and manifest.
      render: shell
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The output. ig-publish redacts only tokens, so replace IDs, names and paths with placeholders.
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ig-publish doctor`
      description: Read-only setup checks; it never prints the token. Replace IDs, names and paths with placeholders.
      render: text
  - type: input
    id: exit
    attributes:
      label: Exit code
      placeholder: "0, 1, 2 or 75"
